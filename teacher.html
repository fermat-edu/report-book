<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>보고서·독서록 제출함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column console — sign-in card, then toolbar + submission list grouped by student */
:root{
  --bg:#eef3f3; --paper:#fff; --ink:#1f2a2c; --muted:#5f6d70; --line:#d3dcdd; --field:#f6f9f9;
  --teal:#3e9ca7; --accent:#2f8792; --new:#1f7a4d; --old:#8a9799; --danger:#c8322f; --yellow:#fee500;
  --display:"Do Hyeon","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#141a1b;--paper:#1d2526;--ink:#e7eeee;--muted:#9fb0b2;--line:#36454a;--field:#232d2f;--accent:#6cc3cc;--new:#5fcf96;--old:#748487;color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:900px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,34px);margin:0}
h1 small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:8px;font-weight:400}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.login{max-width:380px;display:flex;flex-direction:column;gap:10px}
label{font-weight:700;font-size:13px}
input[type=password],input[type=search]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink);white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.small{font-size:12.5px;padding:5px 10px;font-weight:500}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:wait}
.msg{font-size:13.5px;color:var(--muted);min-height:20px}
.msg.err{color:var(--danger)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 220px;min-width:0}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums;margin-right:2px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.who{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.pill.new{color:var(--new)} .pill.old{color:var(--old)}
.item.isold .who{color:var(--muted);font-weight:500}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.progress{height:6px;background:var(--field);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.years{display:flex;gap:6px;flex-wrap:wrap}
.year{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.year[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.year:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvlname{font-size:12.5px;font-weight:700;color:var(--muted)}
.year .n{font-weight:500;opacity:.75;margin-left:4px;font-size:12px}
.classnav{display:flex;gap:6px;flex-wrap:wrap}
.classnav a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--field)}
.cls{border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:12px}
.cls>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--field)}
.cls>summary::-webkit-details-marker{display:none}
.cls>summary .ct{font-family:var(--display);font-size:20px}
.cls>summary .cn{font-size:13px;color:var(--muted);flex:1}
.cls>summary .arrow{color:var(--muted);transition:transform .15s}
.cls[open]>summary .arrow{transform:rotate(90deg)}
.cls .list{padding:0 12px}
.groups{display:flex;flex-direction:column;gap:12px}
@media (max-width:560px){.item{grid-template-columns:1fr}.acts{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>보고서·독서록 제출함<small>선생님 전용</small></h1>
    <button class="btn" id="logoutBtn" type="button" hidden>잠그기</button>
  </header>

  <section class="card login" id="loginCard">
    <label for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="구글 스크립트에 넣은 비밀번호">
    <button class="btn primary" id="loginBtn" type="button">제출함 열기</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section id="main" hidden>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="lvl"><span class="lvlname">비교과 주제</span><div class="years" id="topics" role="group" aria-label="비교과 주제"></div></div>
      <div class="lvl"><span class="lvlname">보고서 종류</span><div class="years" id="forms" role="group" aria-label="보고서 종류"></div></div>
      <div class="years" id="years" role="group" aria-label="연도"></div>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input class="search" type="search" id="q" placeholder="이름이나 반으로 찾기 (예: 홍길동, 9탈레스)" aria-label="찾기">
        <label class="chk"><input type="checkbox" id="onlyNew" checked> 학생별 최신 제출만</label>
        <button class="btn" id="refreshBtn" type="button">새로고침</button>
        <button class="btn primary" id="zipBtn" type="button">전체 받기</button>
      </div>
      <div class="progress" id="prog" hidden><i></i></div>
      <div class="msg" id="msg"></div>
      <div class="classnav" id="classnav"></div>
      <div class="groups" id="list"></div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
const API="https://script.google.com/macros/s/AKfycbzffLVS4wcRspUWGvEN1DbOxQob5ZX-Zb0ckccVD1LppKr-Rn9Vxgxz5DL-Srmla53s/exec";
const $=id=>document.getElementById(id);
let KEY="", FILES=[];
try{KEY=sessionStorage.getItem("teacherKey")||"";}catch(e){}

async function api(params){
  const u=API+"?"+new URLSearchParams({...params,key:KEY,_:Date.now()});
  const r=await fetch(u); const j=await r.json();
  if(!j.ok) throw new Error(j.error||"fail");
  return j;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parse(f){ // "2학년3반_홍길동_1102_2130.pdf"
  let base=f.name.replace(/\.[a-z0-9]{2,4}$/i,"").replace(/_\d{4}_\d{4}$/,""), extra="";
  const em=base.match(/_(영상|발표자료)$/); if(em){ extra=em[1]; base=base.slice(0,-em[0].length); }
  else if(/^video\//.test(f.mime||"")||/\.(mp4|mov|m4v|webm|avi|3gp)$/i.test(f.name)) extra="영상";
  const isVideo=!!extra;
  let form="기타", topic="주제 없음";
  const parts=base.split("__");
  if(parts.length>=3){ topic=parts[0]; form=parts[1]; base=parts.slice(2).join("__"); }
  else if(parts.length===2){ form=parts[0]; base=parts[1]; }
  const m=base.match(/(\d+)\s*학년(.+?)반_(.*)$/); // "1학년가우스1반_홍길동", "1학년S반_김철수"
  let g=m?normGrade(m[1]):99, cr=m?m[2].replace(/\s+/g,""):""; const gm=cr.match(/^(\d+)(\D.*)$/); if(gm){ g=normGrade(gm[1]); cr=gm[2]; }
  const c=m?(/^\d+$/.test(cr)?cr:normClass(cr)):"기타", nm=m?(m[3]||"이름없음").replace(/_/g," "):base.replace(/_/g," ");
  return {...f,who:nm,key:topic+"|"+form+"|"+base+(extra?"|"+extra:""),isVideo,extra,g,c,cls:m?(/^\d+$/.test(c)?g+"학년 "+c+"반":g+c+"반"):"기타",year:new Date(f.time).getFullYear(),form,topic};
}
const fmtTime=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+"MB":Math.max(1,Math.round(b/1024))+"KB";

/* 로그인 */
async function login(){
  $("loginBtn").disabled=true; $("loginMsg").className="msg"; $("loginMsg").textContent="여는 중…";
  try{ const j=await api({action:"list"}); try{sessionStorage.setItem("teacherKey",KEY);}catch(e){}
    NEWCLS=j.classes||[]; FILES=j.files.map(parse); $("loginCard").hidden=true; $("main").hidden=false; $("logoutBtn").hidden=false; render(); }
  catch(e){ $("loginMsg").className="msg err";
    $("loginMsg").textContent=e.message==="password"?"비밀번호가 맞지 않아요. 구글 스크립트에 넣은 비밀번호를 확인해 주세요.":"제출함에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
    try{sessionStorage.removeItem("teacherKey");}catch(_){} }
  finally{ $("loginBtn").disabled=false; }
}
$("loginBtn").addEventListener("click",()=>{KEY=$("pw").value.trim(); if(KEY) login();});
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter"){KEY=$("pw").value.trim(); if(KEY) login();}});
$("logoutBtn").addEventListener("click",()=>{KEY="";FILES=[];try{sessionStorage.removeItem("teacherKey");}catch(e){} $("main").hidden=true;$("loginCard").hidden=false;$("logoutBtn").hidden=true;$("pw").value="";$("loginMsg").textContent="";});

/* 목록 */
let YEAR=null, FORM=null, TOPIC=null;
const CORDER=["페르마","탈레스","유클리드","뉴튼","데카르트","가우스1","가우스2","칸토르1","S"]; // 반 순서 (앞 숫자는 학년 7·8·9)
function normGrade(x){ const n=parseInt(String(x||"").replace(/\D/g,""),10); if(!n) return 99; return n>=1&&n<=3?n+6:n; }
let NEWCLS=[]; // 학생들이 제출하면서 새로 생긴 반 (제출함이 알려 줌)
function normClass(raw){ const A=CORDER.concat(NEWCLS.filter(c=>!CORDER.includes(c))); let t=String(raw||"").replace(/\s+/g,"").replace(/반$/,""); if(!t) return "기타"; if(/^[a-z0-9]+$/i.test(t)) t=t.toUpperCase();
  if(A.includes(t)) return t; const hit=A.filter(c=>c.startsWith(t)); if(hit.length===1) return hit[0];
  const base=A.filter(c=>c.replace(/\d+$/,"")===t); return base.length===1?base[0]:t; }
const TORDER=["꿈조사","디베이트 특강", "AI 리터러시", "일상생활 속에서의 수학", "미세 플라스틱", "그리스로마 신화", "주제 탐구 보고서 작성하기", "군주론", "독서연계 진화론", "물리&철학", "수학&심리학", "세상을 바꾼 화학", "음식과 사회", "검은 눈물, 석유", "엔트로피", "지구 과학&경제", "탄소", "빛", "문화유산", "반려동물", "연예인 팬덤 활동", "10대를 위한 정의란 무엇인가", "BTS & 데미안", "경제의 핏줄 화폐", "통계 보고서 만들기", "대기오염", "사회에서 바라보는 소년법의 의미와 기준", "기후변화"];
function topics(){ const r=x=>{const i=TORDER.indexOf(x);return i<0?99:i;}; return [...new Set(FILES.map(f=>f.topic))].sort((a,b)=>r(a)-r(b)||a.localeCompare(b,"ko")); }
const FT=()=>FILES.filter(f=>f.topic===TOPIC);
const FORDER=["꿈조사보고서","주제탐구보고서","교과연계탐구보고서","독서연계탐구보고서","AI활용작품"];
function forms(){ const r=x=>{const i=FORDER.indexOf(x);return i<0?99:i;}; return [...new Set(FT().map(f=>f.form))].sort((a,b)=>r(a)-r(b)||a.localeCompare(b,"ko")); }
const FF=()=>FT().filter(f=>f.form===FORM);
function years(){ return [...new Set(FF().map(f=>f.year))].sort((x,y)=>y-x); }
function visible(){
  const q=$("q").value.replace(/\s/g,"");
  const latest={}; FILES.forEach(f=>{ const k=f.year+"|"+f.key; if(!latest[k]||latest[k].time<f.time) latest[k]=f; });
  return FF().filter(f=>f.year===YEAR).map(f=>({...f,isNew:latest[f.year+"|"+f.key]===f}))
    .filter(f=>(!$("onlyNew").checked||f.isNew)&&(!q||f.key.replace(/\s/g,"").includes(q)||f.cls.replace(/\s/g,"").includes(q)));
}
function byClass(v){
  const m=new Map(); v.forEach(f=>{ if(!m.has(f.cls)) m.set(f.cls,{g:f.g,c:f.c,files:[]}); m.get(f.cls).files.push(f); });
  const r=c=>{const i=CORDER.indexOf(String(c)); if(i>=0) return i; const k=NEWCLS.indexOf(String(c)); return k<0?999:100+k;};
  return [...m.entries()].sort((a,b)=>a[1].g-b[1].g||r(a[1].c)-r(b[1].c)||String(a[1].c).localeCompare(String(b[1].c),"ko",{numeric:true})).map(([cls,o])=>({cls,files:o.files.sort((x,y)=>x.who.localeCompare(y.who,"ko")||y.time-x.time)}));
}
function itemHtml(f){
  return '<div class="item'+(f.isNew?'':' isold')+'" data-id="'+f.id+'"><div><div class="who">'+esc(f.who)+'</div>'+
    '<div class="meta">'+(f.extra?'<span class="pill" style="color:#1d5fd1">'+(f.extra==="영상"?"🎬 영상":"📊 발표자료")+'</span>':'')+'<span>'+fmtTime(f.time)+' 제출</span><span>'+fmtSize(f.size)+'</span><span class="pill '+(f.isNew?'new">최신':'old">이전 제출')+'</span></div></div>'+
    '<div class="acts"><button class="btn small" data-act="open">열기</button><button class="btn small" data-act="dl">받기</button><button class="btn small danger" data-act="del">삭제</button></div></div>';
}
const openState={};
function render(){
  const ts=topics(); if(!ts.includes(TOPIC)) TOPIC=ts[0]||null;
  const cnt=l=>new Set(l.map(f=>f.key)).size;
  $("topics").innerHTML=ts.length?ts.map(x=>'<button type="button" class="year" data-topic="'+esc(x)+'" aria-pressed="'+(x===TOPIC)+'">'+esc(x)+'<span class="n">'+cnt(FILES.filter(f=>f.topic===x))+'</span></button>').join(""):'<span class="msg">아직 제출이 없어요.</span>';
  const fs=forms(); if(!fs.includes(FORM)) FORM=fs[0]||"주제탐구보고서";
  $("forms").innerHTML=fs.length?fs.map(x=>'<button type="button" class="year" data-form="'+esc(x)+'" aria-pressed="'+(x===FORM)+'">'+esc(x)+'<span class="n">'+cnt(FT().filter(f=>f.form===x))+'</span></button>').join(""):"";
  const ys=years(); if(!ys.includes(YEAR)) YEAR=ys[0]||new Date().getFullYear();
  $("years").innerHTML=(ys.length?ys:[YEAR]).map(y=>'<button type="button" class="year" data-year="'+y+'" aria-pressed="'+(y===YEAR)+'">'+y+'년</button>').join("");
  const inYear=FF().filter(f=>f.year===YEAR);
  const nStu=new Set(inYear.map(f=>f.key)).size, nCls=new Set(inYear.map(f=>f.cls)).size;
  $("stats").innerHTML='<span><b>'+nCls+'</b>개 반</span><span><b>'+nStu+'</b>명 제출</span><span><b>'+inYear.length+'</b>개 파일</span>';
  const groups=byClass(visible());
  $("classnav").innerHTML=groups.length>1?groups.map((g,i)=>'<a href="#cls'+i+'">'+esc(g.cls)+' '+new Set(g.files.map(f=>f.key)).size+'</a>').join(""):"";
  $("list").innerHTML=groups.length?groups.map((g,i)=>
    '<details class="cls" id="cls'+i+'" data-cls="'+esc(g.cls)+'"'+(openState[YEAR+g.cls]===false?'':' open')+'><summary><span class="arrow">▶</span><span class="ct">'+esc(g.cls)+'</span>'+
    '<span class="cn">'+new Set(g.files.map(f=>f.key)).size+'명 · 파일 '+g.files.length+'개</span>'+
    '<button class="btn small" type="button" data-zipcls="'+esc(g.cls)+'">이 반 전체 받기</button></summary>'+
    '<div class="list">'+g.files.map(itemHtml).join("")+'</div></details>'
  ).join(""):'<div class="empty">'+(inYear.length?"찾는 학생이 없어요.":"아직 제출한 학생이 없어요. 학생이 'PDF 만들고 제출'을 누르면 여기에 나타나요.")+'</div>';
  $("zipBtn").textContent=YEAR+"년 전체 받기"; $("zipBtn").disabled=!groups.length;
}
$("topics").addEventListener("click",e=>{const b=e.target.closest("[data-topic]"); if(!b)return; TOPIC=b.dataset.topic; FORM=null; YEAR=null; render();});
$("forms").addEventListener("click",e=>{const b=e.target.closest("[data-form]"); if(!b)return; FORM=b.dataset.form; YEAR=null; render();});
$("years").addEventListener("click",e=>{const b=e.target.closest("[data-year]"); if(!b)return; YEAR=+b.dataset.year; render();});
$("list").addEventListener("toggle",e=>{const d=e.target; if(d.classList&&d.classList.contains("cls")) openState[YEAR+d.dataset.cls]=d.open;},true);
$("q").addEventListener("input",render); $("onlyNew").addEventListener("change",render);
$("refreshBtn").addEventListener("click",async()=>{ $("refreshBtn").disabled=true; $("msg").className="msg"; $("msg").textContent="새로 불러오는 중…";
  try{ const jj=await api({action:"list"}); NEWCLS=jj.classes||[]; FILES=jj.files.map(parse); render(); $("msg").textContent="최신 목록이에요 · "+fmtTime(Date.now()); }
  catch(e){ $("msg").className="msg err"; $("msg").textContent="불러오지 못했어요. 다시 눌러 주세요."; }
  finally{ $("refreshBtn").disabled=false; } });

async function getBlob(id){ const j=await api({action:"file",id});
  const bin=atob(j.pdf), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return {blob:new Blob([u8],{type:"application/pdf"}),name:j.name}; }
function saveBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); }

$("list").addEventListener("click",async e=>{
  const z=e.target.closest("[data-zipcls]"); if(z){ e.preventDefault(); const cls=z.dataset.zipcls; zipFiles(visible().filter(f=>f.cls===cls),TOPIC+"_"+FORM+"_"+YEAR+"년_"+cls.replace(/\s/g,""),false,z); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const item=b.closest(".item"), id=item.dataset.id, f=FILES.find(x=>x.id===id); if(!f) return;
  const act=b.dataset.act;
  if(act==="del"){ item.querySelector(".acts").innerHTML='<span class="confirm">지울까요? <button class="btn small danger" data-act="delYes">지우기</button><button class="btn small" data-act="delNo">취소</button></span>'; return; }
  if(act==="delNo"){ render(); return; }
  if(act==="delYes"){ b.disabled=true; try{ await api({action:"delete",id}); FILES=FILES.filter(x=>x.id!==id); render(); $("msg").className="msg"; $("msg").textContent=f.who+" 파일을 지웠어요. (구글 드라이브 휴지통에서 30일 안에 되살릴 수 있어요)"; }
    catch(_){ $("msg").className="msg err"; $("msg").textContent="지우지 못했어요. 다시 해 주세요."; render(); } return; }
  if(f.isVideo&&(act==="open"||act==="dl")){ // 영상은 구글 드라이브에서 바로 열기/받기
    window.open(act==="open"?"https://drive.google.com/file/d/"+f.id+"/view":"https://drive.google.com/uc?export=download&id="+f.id,"_blank"); return; }
  // 열기: 새 창을 먼저 열어 두어야 팝업 차단을 피할 수 있어요
  const win=act==="open"?window.open("","_blank"):null;
  if(win) win.document.write('<p style="font-family:sans-serif;padding:20px">'+esc(f.who)+' 보고서를 여는 중…</p>');
  b.disabled=true; const old=b.textContent; b.textContent="여는 중…";
  try{ const {blob,name}=await getBlob(id);
    if(act==="open"){ const u=URL.createObjectURL(blob); if(win) win.location.href=u; else window.open(u,"_blank"); }
    else saveBlob(blob,name); }
  catch(_){ if(win) win.close(); $("msg").className="msg err"; $("msg").textContent="파일을 가져오지 못했어요. 다시 눌러 주세요."; }
  finally{ b.disabled=false; b.textContent=old; }
});

/* 압축해서 받기: 연도 전체(반별 폴더) / 반 전체 */
async function zipFiles(v,label,folders,btn){
  const nv=v.filter(f=>f.isVideo).length; v=v.filter(f=>!f.isVideo);
  if(!v.length){ $("msg").className="msg"; $("msg").textContent=nv?"영상·발표자료는 압축 받기에서 빠져요. 옆의 '받기'를 눌러 하나씩 받아 주세요.":""; return; }
  if(!window.JSZip){ $("msg").className="msg err"; $("msg").textContent="압축 도구를 불러오지 못했어요. 새로고침 후 다시 해 주세요."; return; }
  btn.disabled=true; $("prog").hidden=false; const bar=$("prog").firstElementChild; $("msg").className="msg";
  const zip=new JSZip(); let fail=0;
  for(let i=0;i<v.length;i++){
    $("msg").textContent="파일 모으는 중… ("+(i+1)+"/"+v.length+") "+v[i].cls+" "+v[i].who; bar.style.width=(i/v.length*100)+"%";
    try{ const {blob,name}=await getBlob(v[i].id); (folders?zip.folder(v[i].cls.replace(/\s/g,"")):zip).file(name,blob); }catch(e){ fail++; }
  }
  bar.style.width="100%"; $("msg").textContent="압축하는 중…";
  const zname=label+".zip";
  saveBlob(await zip.generateAsync({type:"blob"}),zname);
  $("msg").textContent=(v.length-fail)+"개 파일을 "+zname+"로 받았어요."+(fail?" ("+fail+"개는 가져오지 못했어요)":"")+(nv?" 영상·발표자료 "+nv+"개는 용량이 커서 빠졌어요. 옆의 '받기'로 받아 주세요.":"");
  $("prog").hidden=true; bar.style.width="0"; btn.disabled=false;
}
$("zipBtn").addEventListener("click",()=>zipFiles(visible(),TOPIC+"_"+FORM+"_"+YEAR+"년_전체",true,$("zipBtn")));

if(KEY) login(); else $("pw").focus();
})();
</script>
